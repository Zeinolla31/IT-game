<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Своя Игра: IT Лайт</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #000033;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        /* Кнопки управления */
        .admin-controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .btn-admin {
            padding: 10px 20px;
            background-color: #ffd700;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            color: #000033;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 180px);
            gap: 10px;
            margin-bottom: 30px;
        }

        .category-title {
            background-color: #0000ff;
            border: 2px solid white;
            padding: 10px;
            text-align: center;
            font-size: 0.85em;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .cell {
            background-color: #0000ff;
            border: 2px solid #ffd700;
            color: #ffd700;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
        }

        .cell:hover { background-color: #3333ff; }
        .cell.visited { color: #000066; border-color: #000066; cursor: default; }

        /* Игроки - теперь сетка адаптивная */
        .players-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 1200px;
        }

        .player-card {
            background: #000066;
            border: 1px solid white;
            padding: 10px;
            text-align: center;
        }

        .score { font-size: 1.8em; margin: 5px 0; color: #ffd700; }
        .score-controls button {
            width: 35px; height: 35px; cursor: pointer; border: none; font-weight: bold;
        }
        .btn-plus { background: #28a745; color: white; }
        .btn-minus { background: #dc3545; color: white; }

        /* Окно вопроса */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,50,0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }

        #question-text { font-size: 2em; padding: 20px; max-width: 80%; }
        #answer-text { font-size: 1.8em; color: #00ff00; display: none; margin: 20px; }
        
        .modal-btns button {
            padding: 10px 20px; font-size: 1em; cursor: pointer; margin: 5px;
        }
    </style>
</head>
<body>

    <h1>ИТ-ВИКТОРИНА</h1>

    <div class="admin-controls">
        <button class="btn-admin" onclick="addTeam()">+ ДОБАВИТЬ КОМАНДУ</button>
    </div>

    <div class="board" id="game-board">
        <div class="category-title">Интернет</div>
        <div class="category-title">Устройства</div>
        <div class="category-title">Безопасность</div>
        <div class="category-title">Программы</div>
        <div class="category-title">Разное</div>
    </div>

    <div class="players-container" id="players"></div>

    <div id="modal">
        <div id="question-text">Вопрос</div>
        <div id="answer-text">Ответ</div>
        <div class="modal-btns">
            <button onclick="document.getElementById('answer-text').style.display='block'">ОТВЕТ</button>
            <button onclick="closeModal()">К ТАБЛИЦЕ</button>
        </div>
    </div>

    <script>
        const categories = [
            // Интернет и Сети
            {q: "Как расшифровывается первая буква в протоколе HTTPS (что она дает пользователю)?", a: "Secure (Безопасность/Шифрование)", v: 100},
            {q: "Уникальный номер компьютера в сети, состоящий из четырех чисел (например, 192.168.0.1).", a: "IP-адрес", v: 200},
            {q: "Мировой лидер среди поисковых систем, чье название стало глаголом.", a: "Google", v: 300},
            {q: "Устройство, которое 'раздает' интернет по Wi-Fi в квартире.", a: "Роутер (Маршрутизатор)", v: 400},
            {q: "Служба, которая заменяет длинные IP-адреса на понятные имена сайтов.", a: "DNS", v: 500},

            // Устройства и Железо
            {q: "Основная рабочая память компьютера, которая очищается при выключении.", a: "ОЗУ (Оперативная память / RAM)", v: 100},
            {q: "Как называется 'мозг' компьютера, выполняющий все вычисления?", a: "Процессор (CPU)", v: 200},
            {q: "Накопитель, который работает намного быстрее обычного жесткого диска (HDD).", a: "SSD", v: 300},
            {q: "Программа, которая позволяет операционной системе 'общаться' с принтером или видеокартой.", a: "Драйвер", v: 400},
            {q: "Микросхема на материнской плате, которая отвечает за запуск компьютера до загрузки Windows.", a: "BIOS (или UEFI)", v: 500},

            // Безопасность
            {q: "Секретный набор символов для защиты аккаунта.", a: "Пароль", v: 100},
            {q: "Метод кражи данных, когда пользователю присылают поддельную ссылку на банк или соцсеть.", a: "Фишинг", v: 200},
            {q: "Программа, которая умеет находить и удалять вредоносный код.", a: "Антивирус", v: 300},
            {q: "Тот, кто использует свои знания ИТ для взлома систем или кражи данных.", a: "Хакер", v: 400},
            {q: "Как называется ситуация, когда вирус шифрует все файлы и требует деньги за их возврат?", a: "Шифровальщик (Ransomware / Вымогатель)", v: 500},

            // Программы и ОС
            {q: "Самая популярная в мире операционная система для персональных компьютеров.", a: "Windows", v: 100},
            {q: "Бесплатная операционная система с открытым кодом, символ которой — пингвин.", a: "Linux", v: 200},
            {q: "Процесс удаления ошибок и багов из программного кода.", a: "Отладка (Debugging)", v: 300},
            {q: "Специальная папка, куда попадают удаленные файлы перед окончательным стиранием.", a: "Корзина", v: 400},
            {q: "Популярный язык программирования, названный в честь змеи.", a: "Python", v: 500},

            // Основы ИТ (Разное)
            {q: "Минимальная единица информации, принимающая значение 0 или 1.", a: "Бит", v: 100},
            {q: "Сколько бит содержится в одном байте?", a: "8", v: 200},
            {q: "Как называется снимок того, что происходит на экране монитора?", a: "Скриншот", v: 300},
            {q: "Система счисления, которую понимают компьютеры (состоит из 0 и 1).", a: "Двоичная", v: 400},
            {q: "Текстовый символ, который мы ставим в адресе электронной почты перед доменом.", a: "@ (Собака)", v: 500}
        ];
        
        let lastValue = 0;
        let teamCounter = 0;
        const board = document.getElementById('game-board');
        const playersBox = document.getElementById('players');

        // Создаем поле
        for(let i=0; i<5; i++) {
            for(let j=0; j<5; j++) {
                let d = categories[j*5 + i];
                let c = document.createElement('div');
                c.className = 'cell';
                c.innerText = d.v;
                c.onclick = () => {
                    if(c.classList.contains('visited')) return;
                    lastValue = d.v;
                    document.getElementById('question-text').innerText = d.q;
                    document.getElementById('answer-text').innerText = d.a;
                    document.getElementById('answer-text').style.display = 'none';
                    document.getElementById('modal').style.display = 'flex';
                    c.classList.add('visited');
                };
                board.appendChild(c);
            }
        }

        // Функция добавления команды
        function addTeam() {
            teamCounter++;
            const teamId = teamCounter;
            const card = document.createElement('div');
            card.className = 'player-card';
            card.id = `card-${teamId}`;
            card.innerHTML = `
                <div contenteditable="true">Команда ${teamId}</div>
                <div class="score" id="s${teamId}">0</div>
                <div class="score-controls">
                    <button class="btn-minus" onclick="upd(${teamId},-1)">-</button>
                    <button class="btn-plus" onclick="upd(${teamId},1)">+</button>
                </div>
            `;
            playersBox.appendChild(card);
        }

        // Добавим первые 3 команды автоматически при старте
        for(let i=0; i<3; i++) addTeam();

        function upd(id, dir) {
            let s = document.getElementById('s'+id);
            s.innerText = parseInt(s.innerText) + (dir * lastValue);
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
