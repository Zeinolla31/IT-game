<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Своя Игра: IT Лайт</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #000033;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 180px);
            gap: 10px;
            margin-bottom: 30px;
        }

        .category-title {
            background-color: #0000ff;
            border: 2px solid white;
            padding: 10px;
            text-align: center;
            font-size: 0.85em;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .cell {
            background-color: #0000ff;
            border: 2px solid #ffd700;
            color: #ffd700;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
        }

        .cell:hover { background-color: #3333ff; }
        .cell.visited { color: #000066; border-color: #000066; cursor: default; }

        /* Игроки */
        .players-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 1000px;
        }

        .player-card {
            background: #000066;
            border: 1px solid white;
            padding: 10px;
            text-align: center;
        }

        .score { font-size: 1.8em; margin: 5px 0; color: #ffd700; }
        .score-controls button {
            width: 35px; height: 35px; cursor: pointer; border: none; font-weight: bold;
        }
        .btn-plus { background: #28a745; color: white; }
        .btn-minus { background: #dc3545; color: white; }

        /* Окно вопроса */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,50,0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }

        #question-text { font-size: 2em; padding: 20px; max-width: 80%; }
        #answer-text { font-size: 1.8em; color: #00ff00; display: none; margin: 20px; }
        
        .modal-btns button {
            padding: 10px 20px; font-size: 1em; cursor: pointer; margin: 5px;
        }
    </style>
</head>
<body>

    <h1>ИТ-ВИКТОРИНА</h1>

    <div class="board" id="game-board">
        <div class="category-title">Интернет</div>
        <div class="category-title">Устройства</div>
        <div class="category-title">Безопасность</div>
        <div class="category-title">Программы</div>
        <div class="category-title">Разное</div>
    </div>

    <div class="players-container" id="players">
        </div>

    <div id="modal">
        <div id="question-text">Вопрос</div>
        <div id="answer-text">Ответ</div>
        <div class="modal-btns">
            <button onclick="document.getElementById('answer-text').style.display='block'">ОТВЕТ</button>
            <button onclick="closeModal()">К ТАБЛИЦЕ</button>
        </div>
    </div>

    <script>
        const categories = [
            // Интернет и Сети
            {q: "Протокол прикладного уровня, используемый для передачи гипертекста в зашифрованном виде.", a: "HTTPS (TLS/SSL)", v: 100},
            {q: "Уровневая модель сетевого взаимодействия, состоящая из 7 этапов.", a: "Модель OSI", v: 200},
            {q: "Служба, преобразующая доменные имена в IP-адреса.", a: "DNS", v: 300},
            {q: "Диапазон IP-адресов версии 4, зарезервированный для локальных петель (Loopback).", a: "127.0.0.0 — 127.255.255.255 (обычно 127.0.0.1)", v: 400},
            {q: "Маска подсети по умолчанию для сетей класса C.", a: "255.255.255.0", v: 500},

            // Устройства и Архитектура
            {q: "Энергозависимая часть памяти ПК, используемая для временного хранения данных запущенных программ.", a: "ОЗУ (RAM)", v: 100},
            {q: "Микропрограмма, обеспечивающая начальную загрузку компьютера и проверку оборудования (POST).", a: "BIOS / UEFI", v: 200},
            {q: "Тип памяти, встроенный в процессор для ускорения доступа к данным из ОЗУ.", a: "Кэш-память (L1, L2, L3)", v: 300},
            {q: "Интерфейс подключения SSD-накопителей, работающий напрямую через шину PCIe.", a: "NVMe", v: 400},
            {q: "Архитектура процессора, основанная на сокращенном наборе команд (используется в мобильных чипах).", a: "RISC (или ARM)", v: 500},

            // Безопасность
            {q: "Метод аутентификации, требующий подтверждения через два разных канала связи.", a: "2FA (Двухфакторная аутентификация)", v: 100},
            {q: "Тип атаки, направленный на переполнение канала связи или ресурсов сервера ложными запросами.", a: "DDoS", v: 200},
            {q: "Шифрование, при котором для зашифровки и расшифровки используется один и тот же ключ.", a: "Симметричное шифрование", v: 300},
            {q: "Уязвимость, для которой разработчиками еще не выпущено исправление.", a: "Zero-day (Уязвимость нулевого дня)", v: 400},
            {q: "Процесс преобразования данных в строку фиксированной длины (необратимое шифрование).", a: "Хэширование", v: 500},

            // ОС и ПО
            {q: "Программная прослойка между «железом» и пользователем, управляющая ресурсами системы.", a: "Операционная система (ОС)", v: 100},
            {q: "Ядро этой операционной системы является открытым и распространяется по лицензии GPL.", a: "Linux", v: 200},
            {q: "Системная утилита или служба, переводящая код высокого уровня в машинный код.", a: "Компилятор / Интерпретатор", v: 300},
            {q: "Метод запуска нескольких виртуальных систем на одном физическом сервере.", a: "Виртуализация (Гипервизор)", v: 400},
            {q: "Как называется состояние системы, при котором два процесса бесконечно ждут освобождения ресурсов друг другом?", a: "Deadlock (Взаимная блокировка)", v: 500},

            // Разное (Основы и Логика)
            {q: "Позиционная система счисления с основанием 16.", a: "Шестнадцатеричная (Hexadecimal)", v: 100},
            {q: "Логическая операция, результат которой равен 1 только если оба входа равны 1.", a: "Конъюнкция (И / AND)", v: 200},
            {q: "Сколько уникальных значений можно закодировать в одном байте информации?", a: "256", v: 300},
            {q: "Таблица, сопоставляющая символы и их числовые коды (например, заглавная 'A' — 65).", a: "ASCII (или Unicode)", v: 400},
            {q: "Разработчик ядра Linux и системы контроля версий Git.", a: "Линус Торвальдс", v: 500}
        ];

        let lastValue = 0;
        const board = document.getElementById('game-board');
        const playersBox = document.getElementById('players');

        // Создаем поле
        for(let i=0; i<5; i++) {
            for(let j=0; j<5; j++) {
                let d = categories[j*5 + i];
                let c = document.createElement('div');
                c.className = 'cell';
                c.innerText = d.v;
                c.onclick = () => {
                    if(c.classList.contains('visited')) return;
                    lastValue = d.v;
                    document.getElementById('question-text').innerText = d.q;
                    document.getElementById('answer-text').innerText = d.a;
                    document.getElementById('answer-text').style.display = 'none';
                    document.getElementById('modal').style.display = 'flex';
                    c.classList.add('visited');
                };
                board.appendChild(c);
            }
        }

        // Создаем 5 команд
        for(let i=1; i<=5; i++) {
            playersBox.innerHTML += `
                <div class="player-card">
                    <div contenteditable="true">Команда ${i}</div>
                    <div class="score" id="s${i}">0</div>
                    <div class="score-controls">
                        <button class="btn-minus" onclick="upd(${i},-1)">-</button>
                        <button class="btn-plus" onclick="upd(${i},1)">+</button>
                    </div>
                </div>
            `;
        }

        function upd(id, dir) {
            let s = document.getElementById('s'+id);
            s.innerText = parseInt(s.innerText) + (dir * lastValue);
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
